# Minimal: the first four person entities in Home Assistant
type: custom:streetview-house
grid_options:
  columns: 12
  rows: 3

---
# Full
type: custom:streetview-house
people:
  - entity: person.alex
    name: Alex
    portrait: /local/streetview-house/alex.webp
    height: 1
    distance: sensor.home_alex_distance
    direction: sensor.home_alex_direction_of_travel
    away: race_bike   # while away: race_bike, running, shopping or soccer
  - entity: person.sam
    portrait: /local/streetview-house/sam.webp
    height: 0.97
    away: running
  - entity: person.robin
    portrait: /local/streetview-house/robin.webp
    away: shopping
  - person.kim
entities:
  room_light: light.front_room
  door_light: light.hall
cat: 60          # % of the time the cat is there while someone is home; false: no cat
tap_action:
  action: more-info
hold_action:
  action: none
grid_options:
  columns: 12
  rows: 3
